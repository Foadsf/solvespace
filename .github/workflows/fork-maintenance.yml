# Fork-local automation. This file exists only on Foadsf/solvespace and must never
# be included in a pull request to solvespace/solvespace. Always branch upstream
# contributions from upstream/master, not from this fork's master.
name: Fork maintenance

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report what would happen without pushing or invoking Jules'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: fork-maintenance
  cancel-in-progress: false

env:
  UPSTREAM: solvespace/solvespace
  WATCHED_PR: '1771'
  OWNER: Foadsf

jobs:
  sync:
    name: Merge upstream master
    # Never run anywhere but this fork, so a re-fork of this fork stays quiet.
    if: github.repository == 'Foadsf/solvespace'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Merge upstream master
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream "https://github.com/${UPSTREAM}.git"
          git fetch --quiet upstream master

          behind=$(git rev-list --count HEAD..upstream/master)
          echo "behind upstream/master by ${behind} commit(s)"
          if [ "${behind}" -eq 0 ]; then
            echo 'already up to date'
            exit 0
          fi
          if [ "${DRY_RUN}" = 'true' ]; then
            echo "DRY RUN: would merge upstream/master and push ${behind} commit(s)"
            exit 0
          fi
          # A conflict here should fail the run loudly rather than be papered over.
          git merge --no-edit upstream/master
          git push origin HEAD:master

  watch:
    name: Check watched PR for new review activity
    if: github.repository == 'Foadsf/solvespace'
    runs-on: ubuntu-latest
    outputs:
      dispatch: ${{ steps.check.outputs.dispatch }}
      comment_id: ${{ steps.check.outputs.comment_id }}
      author: ${{ steps.check.outputs.author }}
    steps:
      - uses: actions/checkout@v6

      - name: Find the newest maintainer comment
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          set -euo pipefail
          state='.github/fork-state.json'
          [ -f "${state}" ] || echo '{}' > "${state}"
          seen=$(jq -r --arg k "pr${WATCHED_PR}" '.[$k] // ""' "${state}")

          # Issue comments and review comments both count as maintainer activity.
          # Anything authored by the PR owner is our own noise and is excluded.
          latest=$(
            {
              gh api "repos/${UPSTREAM}/issues/${WATCHED_PR}/comments" --paginate \
                 --jq ".[] | select(.user.login != \"${OWNER}\") | [.id, .user.login] | @tsv"
              gh api "repos/${UPSTREAM}/pulls/${WATCHED_PR}/comments" --paginate \
                 --jq ".[] | select(.user.login != \"${OWNER}\") | [.id, .user.login] | @tsv"
            } | sort -n | tail -1
          )

          if [ -z "${latest}" ]; then
            echo 'no maintainer activity yet'
            echo 'dispatch=false' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          id=$(printf '%s' "${latest}" | cut -f1)
          who=$(printf '%s' "${latest}" | cut -f2)
          echo "latest maintainer comment id=${id} by ${who}; last handled=${seen:-none}"
          echo "comment_id=${id}" >> "${GITHUB_OUTPUT}"
          echo "author=${who}"    >> "${GITHUB_OUTPUT}"

          if [ "${id}" = "${seen}" ]; then
            echo 'already handled'
            echo 'dispatch=false' >> "${GITHUB_OUTPUT}"
          elif [ "${DRY_RUN}" = 'true' ]; then
            echo "DRY RUN: would invoke Jules for comment ${id} by ${who}"
            echo 'dispatch=false' >> "${GITHUB_OUTPUT}"
          else
            echo 'dispatch=true' >> "${GITHUB_OUTPUT}"
          fi

  jules:
    name: Invoke Jules on the review comment
    needs: watch
    if: needs.watch.outputs.dispatch == 'true'
    runs-on: ubuntu-latest
    steps:
      # google-labs-code/jules-action, pinned to the v1.0.0 commit. Their own
      # examples say google-labs-code/jules-invoke@v1, which does not resolve —
      # that repo/tag pair does not exist.
      - name: Invoke Jules
        uses: google-labs-code/jules-action@bff7875eaa123cac6742b7cfc51005b95ba4d566
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          starting_branch: windows-release-ship-cli
          prompt: |
            Ground rules for this task — follow them exactly:
            1. EVIDENCE. For every factual claim, quote the exact line you relied on with
               its file path and line number (or document URL). If you cannot find it,
               write NOT FOUND. Never write "the docs say" without the excerpt.
            2. NO SEARCH-QUERY SOURCES. A search-engine query URL is not a source.
               Provenance must be a document URL or file path plus one verbatim quote.
            3. CONTRADICTIONS. If an acceptance criterion contradicts the spec or the
               data, say so explicitly and do NOT mark it PASS.
            4. MEASURE AND JUDGE SEPARATELY. Report the measured value and the verdict as
               two distinct fields. Never let the verdict stand in for the measurement.
            5. NEGATIVE CONTROL. Produce an artefact that MUST FAIL the check, run the
               check on it, and show it failing. If you cannot, the check proves nothing.
            6. DONE MEANS PROVEN. Do not report done until every acceptance command exits
               0. Paste the actual command output, not a description of it. If the
               evidence is a CI run, it must have CONCLUDED — a run still in progress is
               not evidence, and reporting done against one is a failure.
            7. UNCERTAINTY. End with everything you were unsure about or could not verify.
               An empty list is itself a claim, and I will check it.

            A maintainer commented on solvespace/solvespace pull request #1771, which is
            open from branch windows-release-ship-cli in this repository. That PR ships
            solvespace-cli.exe in the Windows release assets.

            Read the full conversation at
            https://github.com/solvespace/solvespace/pull/1771
            and the linked issue https://github.com/solvespace/solvespace/issues/1770
            before proposing anything.

            BEFORE CHANGING ANYTHING, establish whether the maintainer considers the
            current behaviour intentional, and whether any stated reason still holds.
            Read the originating pull request BODY, not just commit titles. If the
            request is a design decision rather than a defect, say so and propose nothing.

            windows-release-ship-cli is the BASE for your work and it backs a submitted
            pull request. Do NOT commit to it, push to it, or force-push it. Put every
            change on your own new branch and open a pull request against
            windows-release-ship-cli so a human merges it deliberately.

            Keep the change minimal and confined to .github/scripts/build-windows.sh,
            .github/workflows/cd.yml and CHANGELOG.md unless the maintainer explicitly
            asked for something else. Do NOT commit environment setup, bootstrap or
            tooling scripts of your own — nothing like get_gh.sh in the repository root.

            Do NOT comment on any GitHub issue or pull request. Leave the reply as a
            draft in your summary for a human to send.

            Acceptance: quote each maintainer request verbatim, and next to it state
            either the exact diff hunk that answers it or NOT ADDRESSED with the reason.

  record:
    name: Record the handled comment
    needs: [watch, jules]
    if: needs.watch.outputs.dispatch == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Commit the new watermark
        run: |
          set -euo pipefail
          state='.github/fork-state.json'
          [ -f "${state}" ] || echo '{}' > "${state}"
          jq --arg k "pr${WATCHED_PR}" --arg v '${{ needs.watch.outputs.comment_id }}' \
             '.[$k] = $v' "${state}" > "${state}.tmp"
          mv "${state}.tmp" "${state}"
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${state}"
          git diff --cached --quiet && { echo 'no change'; exit 0; }
          git commit -m "fork-maintenance: handled ${UPSTREAM}#${WATCHED_PR} comment ${{ needs.watch.outputs.comment_id }}"
          git push origin HEAD:master
